<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Agencia experta en Mantenimiento de Equipos, Desarrollo de Software (ERP, CRM), Páginas Web y Apps Móviles. Soluciones IT integrales.">
    <title>TechHmo | Contactar</title>
    
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="./styles/main.css">
</head>
<body>
    <!-- Preloader -->
    <div class="preloader">
        <div class="loader-content">
            <div class="glowing-rings">
                <div class="ring ring-1"></div>
                <div class="ring ring-2"></div>
                <div class="ring ring-3"></div>
            </div>
            <div class="loading-text">
                <span class="logo-text" style="font-size: 1.2rem;">TECHHMO</span>
                <div class="loading-bar">
                    <div class="progress"></div>
                </div>
            </div>
        </div>
    </div>
    <!-- Background Decorators -->
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">
                <img src="./assets/logo.png" alt="TechHmo Logo" style="height: 40px; border-radius: 8px;">
                <span class="logo-text">TECHHMO</span>
            </a>
            <div class="nav-links">
                <a href="index.html">Inicio</a>
                <a href="servicios.html">Servicios</a>
                <a href="experiencia.html">Experiencia</a>
                <a href="contacto.html" class="btn-primary-outline">Contactar</a>
            </div>
            <button class="mobile-menu-btn" aria-label="Abrir menú">
                <i class="ph ph-list"></i>
            </button>
        </div>
    </nav>

    <!-- Call to Action / Contact -->
    <section id="contacto" class="contact" style="padding-top: 8rem; min-height: calc(100vh - 100px);">
        <div class="container">
            <div class="contact-card glass-card reveal">
                <div class="contact-info">
                    <h2>¿Listo para digitalizar tu negocio?</h2>
                    <p>Contáctanos hoy mismo para una consultoría gratuita. Nos adaptamos a las necesidades de tu empresa.</p>
                    <div class="hero-socials">
                        <a href="https://wa.me/526622028681" target="_blank" rel="noopener noreferrer" class="social-icon whatsapp" aria-label="WhatsApp"><i class="ph-fill ph-whatsapp-logo"></i></a>
                        <a href="https://www.facebook.com/profile.php?id=100091979785658" target="_blank" rel="noopener noreferrer" class="social-icon facebook" aria-label="Facebook"><i class="ph-fill ph-facebook-logo"></i></a>
                        <a href="https://www.instagram.com/tech.hmo" target="_blank" rel="noopener noreferrer" class="social-icon instagram" aria-label="Instagram"><i class="ph-fill ph-instagram-logo"></i></a>
                        <a href="#" class="social-icon linkedin" aria-label="LinkedIn"><i class="ph-fill ph-linkedin-logo"></i></a>
                    </div>
                </div>
                <form class="contact-form">
                    <input type="text" placeholder="Tu Nombre" required>
                    <input type="email" placeholder="Correo Electrónico" required>
                    <textarea placeholder="Cuéntanos sobre tu proyecto o necesidad..." rows="4" required></textarea>
                    <button type="submit" class="btn-primary">Enviar Mensaje</button>
                </form>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container footer-container">
            <p>&copy; 2026 TechHmo. Todos los derechos reservados.</p>
            <div class="footer-links">
                <a href="#">Privacidad</a>
                <a href="#">Términos</a>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="./js/app.js"></script>
</body>
</html>
